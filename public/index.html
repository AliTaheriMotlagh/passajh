<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>پاساژ — نقشه مراکز خرید تهران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- City view -->
  <section id="city-view" class="view">
    <div id="city-map"></div>
    <header class="topbar">
      <div class="brand">پاساژ<small>PASSAJH · TEHRAN</small></div>
      <div class="search">
        <input id="city-search" type="search" autocomplete="off" placeholder="دنبال چه کالایی هستی؟ آیفون، مانتو، زعفران…">
        <div id="city-results" class="results hidden"></div>
      </div>
      <button class="btn primary" data-action="request">📣 درخواست کالا</button>
      <button class="btn" data-action="myreq">📬 <span class="hide-sm">درخواست‌های من</span> <b class="badge hidden"></b></button>
    </header>
    <aside id="mall-list" class="panel"></aside>
    <div id="mall-card" class="panel hidden"></div>
    <button id="btn-locate" class="fab" title="موقعیت من">◎</button>
  </section>

  <!-- Mall view -->
  <section id="mall-view" class="view hidden">
    <canvas id="mall-canvas"></canvas>
    <header class="topbar">
      <button class="btn" id="btn-back" title="بازگشت به نقشه شهر">→ شهر</button>
      <div class="brand mall-title" id="mall-title"></div>
      <div class="search">
        <input id="mall-search" type="search" autocomplete="off" placeholder="جستجوی کالا یا فروشگاه در این پاساژ…">
        <div id="mall-results" class="results hidden"></div>
      </div>
      <button class="btn" id="btn-discounts">🏷️ <span class="hide-sm">تخفیف‌ها</span></button>
      <button class="btn" id="btn-legend">🗺️ <span class="hide-sm">راهنما</span></button>
      <button class="btn primary" data-action="request">📣 <span class="hide-sm">درخواست کالا</span></button>
      <button class="btn" data-action="myreq">📬 <b class="badge hidden"></b></button>
    </header>

    <div id="hud-money" class="hud-money"></div>
    <div id="help-box" class="help-box hidden"></div>
    <div id="route-hint" class="route-hint hidden"></div>

    <nav id="floor-picker" class="floor-picker"></nav>

    <div class="radar-wrap">
      <canvas id="radar"></canvas>
      <div id="location-text" class="location-text"></div>
    </div>

    <div class="map-tools">
      <button class="tool" id="btn-zoom-in" title="بزرگنمایی">+</button>
      <button class="tool" id="btn-zoom-out" title="کوچک‌نمایی">−</button>
      <button class="tool" id="btn-full" title="نقشه کامل طبقه (M)">⛶</button>
      <button class="tool" id="btn-center" title="مرکز روی من">◎</button>
      <button class="tool" id="btn-car" title="ماشینم اینجاست">🚗</button>
    </div>

    <div id="joystick" class="joystick"><div class="stick"></div></div>
    <div class="controls-hint hide-sm">WASD / ← ↑ → ↓ حرکت · Shift دویدن · کلیک روی راهرو: برو آنجا · کلیک روی مغازه: محصولات · M نقشه کامل</div>

    <aside id="store-panel" class="drawer hidden"></aside>
    <aside id="legend" class="drawer hidden"></aside>
    <aside id="discounts-panel" class="drawer hidden"></aside>
    <div id="fade" class="fade"></div>
  </section>

  <!-- Shared -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <aside id="myreq-panel" class="drawer hidden"></aside>
  <div id="toasts" class="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
